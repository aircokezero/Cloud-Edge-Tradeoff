name: CI/CD Pipeline

# Cloud-Edge Tradeoff — Experiment 7
# Automates: lint -> unit tests -> DVC data version check -> Docker build + smoke test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint dependencies
        working-directory: api
        run: pip install -r requirements-dev.txt

      - name: Run ruff
        working-directory: api
        run: ruff check .

  test:
    name: Unit Tests (pytest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: api
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run pytest
        working-directory: api
        run: pytest tests -v

  dvc-check:
    name: DVC Data Version Check
    runs-on: ubuntu-latest
    # Independent of lint/test/build — this validates the dataset itself is in
    # sync with the DagsHub remote, not the API code, so it doesn't need to
    # block or be blocked by the other jobs.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install DVC
        run: pip install "dvc[s3]" dagshub

      - name: Configure DagsHub remote credentials
        # Requires a repo secret named DAGSHUB_TOKEN (Settings -> Secrets and
        # variables -> Actions -> New repository secret). Never hardcode the
        # token in this file.
        run: |
          dvc remote modify --local storage access_key_id ${{ secrets.DAGSHUB_TOKEN }}
          dvc remote modify --local storage secret_access_key ${{ secrets.DAGSHUB_TOKEN }}

      - name: Check local data is in sync with the remote (version check)
        run: dvc status -c

      - name: Pull data
        run: dvc pull

  build-and-smoke-test:
    name: Build Docker Image & Smoke Test
    runs-on: ubuntu-latest
    needs: [ lint, test ]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        working-directory: api
        run: docker build -t cloud-edge-api:${{ github.sha }} .

      - name: Run container
        run: docker run -d -p 8000:8000 --name cloud-edge-api cloud-edge-api:${{ github.sha }}

      - name: Wait for the API to become healthy
        run: |
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8000/health; then
              echo "API is up"
              exit 0
            fi
            echo "Waiting for API... ($i/10)"
            sleep 3
          done
          echo "API did not become healthy in time"
          docker logs cloud-edge-api
          exit 1

      - name: Smoke test — /health response
        run: curl -sf http://localhost:8000/health | tee health_response.json

      - name: Smoke test — invalid payload returns 422
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8000/predict/edge \
            -H "Content-Type: application/json" \
            -d '{"Temperature":1,"Pressure":1,"Vibration":1,"Network_Latency":1,"Edge_Processing_Time":1,"Fuzzy_PID_Output":1,"Maintenance_Status":"NotReal","Predicted_Failure":0}')
          echo "Status code: $status"
          test "$status" = "422"

      - name: Show container logs (always, useful for debugging failures)
        if: always()
        run: docker logs cloud-edge-api

      - name: Stop and remove container
        if: always()
        run: docker rm -f cloud-edge-api
